# LitraRag pre-commit hooks: run automatically on every `git commit`.
# The main tools run through `uv run`, so they use the exact versions in uv.lock.

repos:
  # Small hygiene checks from pre-commit's standard collection
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Our quality gate, using the project's own tool versions
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest (unit tests only)
        entry: uv run pytest -m "not integration" -q
        language: system
        types: [python]
        pass_filenames: false