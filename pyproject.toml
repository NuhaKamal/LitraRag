[project]
name = "litrarag"
version = "0.1.0"
description = "LitraRag: a local RAG system with OCR, hybrid search and Ollama"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle: style errors
    "F",    # pyflakes: real bugs (unused imports, undefined names)
    "I",    # isort: import ordering
    "B",    # bugbear: likely bugs and design problems
    "UP",   # pyupgrade: use modern Python syntax
    "SIM",  # simplify: code that can be written more simply
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: uses real external programs or services (Tesseract, Ollama, Qdrant)",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportUnnecessaryTypeIgnoreComment = "warning"
